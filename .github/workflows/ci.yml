name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  core:
    name: pnc_core (plain CMake, no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - name: Configure
        run: cmake -S src/pnc_core -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Baseline tracking metrics
        run: |
          ./build/track_sim circle circle.csv
          ./build/track_sim straight straight.csv

  ros:
    name: ROS 2 Jazzy colcon build
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test
          colcon test-result --verbose
      - name: Gazebo smoke tests (headless, every scenario)
        run: |
          source install/setup.bash
          failed=""
          for sc in s1_straight_offset s2_circle s3_narrow_passage s4_u_turn \
                    s5_static_obstacles s7_parallel_parking; do
            echo "::group::$sc"
            ros2 launch pnc_bringup sim_tracking.launch.py scenario:=$sc headless:=true \
              > sim_$sc.log 2>&1 &
            # Safety limits, not performance targets: about half the clearance
            # between the car and the nearest wall or cone in each world.
            case $sc in
              s3_narrow_passage|s5_static_obstacles) max_cte=0.15 ;;
              s4_u_turn) max_cte=0.25 ;;
              *) max_cte=0.05 ;;
            esac
            rc=0
            timeout 240 python3 tools/sim_smoke_test.py --timeout 90 --max-cte $max_cte || rc=$?
            pkill -INT -f "ros2 launch" || true
            sleep 4
            pkill -9 -f "gz sim|parameter_bridge|tracking_controller|reference_path" || true
            if [ "$rc" -ne 0 ]; then tail -50 sim_$sc.log; failed="$failed $sc"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
