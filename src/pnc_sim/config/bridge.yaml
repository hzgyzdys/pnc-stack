# ros_gz_bridge topics between Gazebo and ROS 2.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Ground-truth odometry of the rear-axle centre.
- ros_topic_name: /odom
  gz_topic_name: /model/ackermann_car/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# odom -> base_link transform, for RViz.
- ros_topic_name: /tf
  gz_topic_name: /model/ackermann_car/pose
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# Speed and yaw rate from the tracking controller.
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/ackermann_car/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
